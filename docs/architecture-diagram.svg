<svg viewBox="0 0 1180 440" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="440" fill="#f8fafc" />

  <text x="20" y="34" font-size="20" font-weight="700" fill="#0f172a">net-vue — Product Management Platform</text>
  <text x="20" y="56" font-size="13" fill="#64748b">ASP.NET Core + Vue 3 + PostgreSQL/EF Core + Redis + Kafka, Kubernetes</text>

  <g>
    <rect x="30" y="110" width="150" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
    <text x="105" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">Cliente Vue</text>
    <text x="105" y="153" text-anchor="middle" font-size="10" fill="#4338ca">Vuetify UI</text>
  </g>

  <g>
    <rect x="220" y="110" width="180" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <text x="310" y="135" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">ProductsController</text>
    <text x="310" y="153" text-anchor="middle" font-size="9.5" fill="#1e40af">adaptador REST</text>
  </g>

  <g>
    <rect x="440" y="110" width="190" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="535" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">ProductService</text>
    <text x="535" y="153" text-anchor="middle" font-size="9.5" fill="#166534">capa de aplicación</text>
  </g>

  <g>
    <rect x="670" y="110" width="190" height="60" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5" />
    <text x="765" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">ProductRepository</text>
    <text x="765" y="153" text-anchor="middle" font-size="9.5" fill="#3730a3">EF Core</text>
  </g>

  <g>
    <ellipse cx="1000" cy="140" rx="110" ry="38" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="1000" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">PostgreSQL</text>
    <text x="1000" y="153" text-anchor="middle" font-size="9.5" fill="#92400e">EF Core migrations</text>
  </g>

  <g>
    <rect x="440" y="220" width="200" height="60" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5" />
    <text x="540" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#701a75">KafkaProductEventPublisher</text>
    <text x="540" y="263" text-anchor="middle" font-size="9.5" fill="#86198f">IProductEventPublisher</text>
  </g>

  <g>
    <rect x="220" y="220" width="150" height="60" rx="10" fill="#f3e8ff" stroke="#a21caf" stroke-width="1.5" />
    <text x="295" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#701a75">Kafka</text>
    <text x="295" y="263" text-anchor="middle" font-size="9.5" fill="#86198f">product-events</text>
  </g>

  <g>
    <rect x="30" y="220" width="150" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="105" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">RateLimitingMiddleware</text>
    <text x="105" y="263" text-anchor="middle" font-size="9.5" fill="#991b1b">→ Redis</text>
  </g>

  <g>
    <rect x="30" y="320" width="1120" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="50" y="346" font-size="12" font-weight="700" fill="#0f172a">Notas de diseño</text>
    <text x="50" y="368" font-size="10.5" fill="#334155">JWT RS256 (demo keypair), rate limiting propio vía middleware + Redis (fixed window, INCR atómico). Mismo dominio y</text>
    <text x="50" y="386" font-size="10.5" fill="#334155">tópico Kafka product-events que los hermanos Quarkus/Spring — implementación en C#/.NET en vez de Java.</text>
  </g>

  <line x1="180" y1="140" x2="218" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="400" y1="140" x2="438" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="630" y1="140" x2="668" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="860" y1="140" x2="888" y2="140" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="535" y1="170" x2="540" y2="218" stroke="#a21caf" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="440" y1="250" x2="372" y2="250" stroke="#a21caf" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="310" y1="170" x2="130" y2="218" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)" />

  <text x="20" y="435" font-size="10.5" fill="#94a3b8">Hermano de Product Management (5 stacks) — mismo dominio, mismo tópico Kafka product-events, distinto backend/frontend.</text>
</svg>
